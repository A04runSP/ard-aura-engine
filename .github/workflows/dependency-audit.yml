name: Dependency Security Audit

on:
  push:
    branches:
      - stage-1/foundation-implementation
    paths:
      - .github/workflows/dependency-audit.yml
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Run npm audit against the committed lockfile
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-report.json
          audit_exit=$?
          echo "audit_exit=$audit_exit" >> "$GITHUB_OUTPUT"
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
          const meta = report.metadata?.vulnerabilities ?? {};
          console.log('=== NPM AUDIT SUMMARY ===');
          console.log(JSON.stringify(meta, null, 2));
          console.log('=== VULNERABLE DEPENDENCIES ===');
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              installedVersions: item.range ? item.nodes : undefined,
              nodes: item.nodes,
              fixAvailable: item.fixAvailable,
              via: item.via
            }, null, 2));
          }
          NODE
          echo "npm audit exit code: $audit_exit"
      - name: Upload complete audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: warn
          retention-days: 7
