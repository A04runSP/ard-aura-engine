name: Foundation CI

on:
  push:
    branches:
      - stage-1/foundation-implementation
  pull_request:
    branches:
      - foundation/architecture-and-structure

permissions:
  contents: write

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Generate and commit dependency lockfile when missing
        run: |
          npm install
          if [ ! -f package-lock.json ]; then
            echo "npm did not generate package-lock.json"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add reproducible npm lockfile"
            git push
          fi
      - name: Install exact locked dependencies
        run: npm ci
      - name: Run foundation checks
        run: npm run check
