name: Foundation CI

on:
  push:
    branches:
      - stage-1/foundation-implementation
  pull_request:
    branches:
      - foundation/architecture-and-structure

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Print canonical TextField formatting for diagnosis
        run: npx prettier src/shared/components/TextField.tsx
      - name: Run foundation checks
        run: npm run check
