name: Foundation CI

on:
  push:
    branches:
      - stage-1/foundation-implementation
  pull_request:
    branches:
      - foundation/architecture-and-structure

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: npm install
      - name: Run foundation checks
        run: npm run check
