name: Dependency Override Compatibility Probe

on:
  push:
    branches:
      - stage-1/foundation-implementation
    paths:
      - .github/workflows/dependency-override-probe.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Stage 1 branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Apply scoped minimatch security override
        run: npm pkg set 'overrides.@typescript-eslint/typescript-estree.minimatch=^11.0.1'
      - name: Regenerate exact lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact candidate dependency tree
        run: npm ci
      - name: Verify resolved minimatch versions
        run: npm ls minimatch
      - name: Run all foundation checks
        run: npm run check
      - name: Require a clean dependency audit
        run: npm audit --audit-level=low
      - name: Commit only the validated dependency manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Fix minimatch advisory in TypeScript ESLint dependency"
          git push origin HEAD:stage-1/foundation-implementation
