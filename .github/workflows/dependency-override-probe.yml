name: Dependency Override Compatibility Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Stage 1 branch
        uses: actions/checkout@v4
        with:
          ref: stage-1/foundation-implementation
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Configure isolated minimatch override candidate
        run: npm pkg set 'overrides.@typescript-eslint/typescript-estree.minimatch=^11.0.1'
      - name: Resolve candidate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Install candidate dependency tree
        run: npm ci
      - name: Report minimatch resolution
        run: npm ls minimatch
      - name: Run full foundation checks
        run: npm run check
      - name: Run candidate dependency audit
        run: npm audit --audit-level=low
